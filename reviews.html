<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer Reviews | Lupin Craftings</title>
<meta name="description" content="Reviews and photos from Lupin Craftings customers.">
<link rel="icon" href="images/lc-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div style="width:100%;background:#FFFFFF;color:#141414;font-family:'Inter',system-ui,sans-serif">

  <div id="site-header" data-active="reviews"></div>

  <div style="background:#F6F5F2;border-bottom:1px solid #E2E0DA">
    <div class="lc-wrap" style="padding-top:72px;padding-bottom:72px;display:flex;flex-wrap:wrap;gap:48px;align-items:flex-start">
      <div style="flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:16px">
        <div style="font-size:13px;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;color:#1F6B40">Reviews</div>
        <h1 style="margin:0;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:48px;line-height:1.08;text-wrap:balance">What our customers say</h1>
        <p style="margin:0;font-size:17px;line-height:1.7;color:#55524D">Bought something from Lupin Craftings? Share a few words, a star rating and a photo of your product. We read every review and publish it after checking.</p>
        <div id="rv-summary" style="font-size:16px;color:#141414"></div>
      </div>
      <div id="rv-form-wrap" style="flex:1.2 1 400px;min-width:0;background:#FFFFFF;border:1px solid #E2E0DA;padding:28px;box-sizing:border-box"></div>
    </div>
  </div>

  <div class="lc-wrap" style="padding-top:56px;padding-bottom:72px">
    <div id="rv-list" class="rv-list" aria-live="polite"></div>
  </div>

  <div id="site-footer"></div>

</div>
<script src="js/content.js"></script>
<script src="js/site.js"></script>
<script src="js/auth.js"></script>
<script src="js/reviews.js"></script>
</body>
</html>
